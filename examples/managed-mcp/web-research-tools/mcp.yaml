schema_version: 1
id: local-web-research
name: Local Web Research
description: Fetch one public web page or crawl a small, bounded tree of public pages.
version: 0.2.0

runtime:
  type: python
  command: uv
  args: [run, --frozen, server.py]
  working_directory: .

transport:
  type: stdio

security:
  profile: confined
  filesystem_roots: [./data]
  read_only: false
  root_write: false

environment:
  MCP_WEB_USER_AGENT:
    default: LambdaWebUI-WebResearch/0.1
    description: User-Agent sent with public web requests.
  MCP_WEB_MAX_RESPONSE_BYTES:
    default: "8388608"
    description: Maximum bytes read from one response; larger textual pages are partially extracted.
  MCP_WEB_MAX_OUTPUT_CHARACTERS:
    default: "50000"
    description: Maximum cleaned characters returned for one page.
  MCP_WEB_MAX_CRAWL_PAGES:
    default: "20"
    description: Hard ceiling for pages visited by one crawl.
  MCP_WEB_MAX_CRAWL_DEPTH:
    default: "2"
    description: Hard ceiling for link depth in one crawl.
  MCP_WEB_MAX_CRAWL_CHARACTERS:
    default: "120000"
    description: Hard ceiling for combined page content returned by one crawl.
  MCP_WEB_TIMEOUT_SECONDS:
    default: "15"
    description: Network timeout for one request.
  MCP_WEB_MAX_REDIRECTS:
    default: "5"
    description: Maximum redirects followed by one page request.
  MCP_WEB_ROBOTS_POLICY:
    default: respect
    description: Crawl policy; respect checks robots.txt and ignore bypasses it explicitly.
  MCP_WEB_CRAWL_DELAY_SECONDS:
    default: "0.25"
    description: Minimum delay between crawl requests to the same origin.
  MCP_WEB_CACHE_TTL_SECONDS:
    default: "300"
    description: Lifetime of a successful in-memory response cache entry; zero disables caching.
  MCP_WEB_CACHE_MAX_ENTRIES:
    default: "64"
    description: Maximum successful responses retained in the in-memory cache.
  MCP_WEB_INLINE_CHARACTERS:
    default: "12000"
    description: Maximum cleaned content returned inline before the full result moves to an artifact.
  MCP_WEB_ARTIFACT_DIR:
    default: data/artifacts
    description: Artifact directory; the service requires it to remain beneath this package's data directory.
  MCP_WEB_ARTIFACT_TTL_SECONDS:
    default: "3600"
    description: Artifact lifetime in seconds before automatic cleanup.
  MCP_WEB_ARTIFACT_MAX_COUNT:
    default: "64"
    description: Maximum number of retained artifacts; oldest artifacts are evicted first.
  MCP_WEB_ARTIFACT_MAX_TOTAL_BYTES:
    default: "33554432"
    description: Maximum combined artifact storage in bytes.
  MCP_WEB_ARTIFACT_MAX_BYTES:
    default: "2097152"
    description: Maximum serialized size of one artifact in bytes.
  MCP_WEB_ARTIFACT_MAX_READ_CHARACTERS:
    default: "20000"
    description: Maximum characters returned by one artifact range read.
  MCP_WEB_ARTIFACT_MAX_SEARCH_MATCHES:
    default: "20"
    description: Maximum matches returned by one artifact search.
  MCP_WEB_ARTIFACT_MAX_SEARCH_CONTEXT_CHARACTERS:
    default: "500"
    description: Maximum context characters returned on each side of a search match.

limits:
  startup_timeout_seconds: 30
  call_timeout_seconds: 120
  memory_mb: 384
  restart: on-failure
