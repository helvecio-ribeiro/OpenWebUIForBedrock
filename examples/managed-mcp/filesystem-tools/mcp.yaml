schema_version: 1
id: local-system-tools
name: Local System Tools
description: Current local date/time and root-confined filesystem operations.
version: 0.2.0

runtime:
  type: python
  command: uv
  args: [run, --frozen, server.py]
  working_directory: .

transport:
  type: stdio

security:
  profile: confined
  filesystem_roots: [/home/helvecio]
  read_only: false
  root_write: false

environment:
  MCP_LOCAL_TIMEZONE:
    default: America/Mexico_City
    description: IANA timezone used by get_current_datetime for local date references.
  MCP_FILESYSTEM_ROOT:
    default: /home/helvecio
    description: The only home directory this server may read or modify.
  MCP_FILESYSTEM_MAX_READ_BYTES:
    default: "1048576"
    description: Maximum bytes returned by one read operation.

limits:
  startup_timeout_seconds: 30
  call_timeout_seconds: 30
  memory_mb: 256
  restart: on-failure
